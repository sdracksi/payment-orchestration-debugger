services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: payment-debugger-api

    working_dir: /app

    command: >
      bash -c "
        bundle install &&
        bin/rails server -b 0.0.0.0
      "

    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17

    container_name: payment-debugger-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: payment_orchestration_debugger_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8

    container_name: payment-debugger-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  bundle_cache: